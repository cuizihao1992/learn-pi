<svg xmlns="http://www.w3.org/2000/svg" width="960" height="520" viewBox="0 0 960 520" role="img" aria-labelledby="title desc">
  <title id="title">月亮周期、身体周期与意义解释</title>
  <desc id="desc">一张把月亮周期、女性生理周期、社会历法和宗教意义连接起来的学习图。</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#102033"/>
      <stop offset="55%" stop-color="#233750"/>
      <stop offset="100%" stop-color="#36526f"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#0f172a" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="960" height="520" rx="24" fill="url(#sky)"/>
  <g fill="#ffffff" opacity="0.55">
    <circle cx="84" cy="62" r="2"/>
    <circle cx="174" cy="110" r="1.8"/>
    <circle cx="772" cy="78" r="2.4"/>
    <circle cx="854" cy="170" r="1.6"/>
    <circle cx="690" cy="402" r="2"/>
    <circle cx="286" cy="440" r="1.7"/>
  </g>
  <g transform="translate(480 220)">
    <circle r="126" fill="none" stroke="#dbeafe" stroke-width="3" stroke-dasharray="8 10" opacity="0.9"/>
    <circle r="68" fill="#eef6ff" filter="url(#softShadow)"/>
    <path d="M480 152a68 68 0 0 0 0 136a48 68 0 0 1 0-136z" transform="translate(-480 -220)" fill="#b8c7d9" opacity="0.72"/>
    <text x="0" y="-4" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" fill="#102033" font-weight="700">约 29.53 天</text>
    <text x="0" y="24" text-anchor="middle" font-family="Arial, sans-serif" font-size="15" fill="#334155">朔望月</text>
  </g>
  <g font-family="Arial, sans-serif" font-size="16" fill="#e5f0ff">
    <g transform="translate(452 70)">
      <circle cx="28" cy="28" r="22" fill="#0f172a" stroke="#e5f0ff" stroke-width="2"/>
      <text x="28" y="66" text-anchor="middle">新月</text>
    </g>
    <g transform="translate(675 195)">
      <circle cx="28" cy="28" r="22" fill="#e5f0ff"/>
      <path d="M28 6a22 22 0 0 1 0 44a13 22 0 0 0 0-44z" fill="#0f172a" opacity="0.9"/>
      <text x="28" y="66" text-anchor="middle">上弦</text>
    </g>
    <g transform="translate(452 362)">
      <circle cx="28" cy="28" r="22" fill="#e5f0ff"/>
      <text x="28" y="66" text-anchor="middle">满月</text>
    </g>
    <g transform="translate(229 195)">
      <circle cx="28" cy="28" r="22" fill="#e5f0ff"/>
      <path d="M28 6a13 22 0 0 1 0 44a22 22 0 0 0 0-44z" fill="#0f172a" opacity="0.9"/>
      <text x="28" y="66" text-anchor="middle">下弦</text>
    </g>
  </g>
  <g font-family="Arial, sans-serif">
    <g transform="translate(54 310)" filter="url(#softShadow)">
      <rect width="262" height="128" rx="16" fill="#f8fafc"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#0f172a">身体节律</text>
      <text x="22" y="68" font-size="15" fill="#334155">女性周期常见约 21-35 天</text>
      <text x="22" y="94" font-size="15" fill="#334155">接近月周期，但不等于被月亮控制</text>
    </g>
    <g transform="translate(644 310)" filter="url(#softShadow)">
      <rect width="262" height="128" rx="16" fill="#f8fafc"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#0f172a">社会历法</text>
      <text x="22" y="68" font-size="15" fill="#334155">月份、节期、工资、账期</text>
      <text x="22" y="94" font-size="15" fill="#334155">把自然节律制度化</text>
    </g>
    <g transform="translate(54 92)" filter="url(#softShadow)">
      <rect width="262" height="128" rx="16" fill="#f8fafc"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#0f172a">信仰解释</text>
      <text x="22" y="68" font-size="15" fill="#334155">月亮像外在时间标记</text>
      <text x="22" y="94" font-size="15" fill="#334155">身体像内在生命历法</text>
    </g>
    <g transform="translate(644 92)" filter="url(#softShadow)">
      <rect width="262" height="128" rx="16" fill="#f8fafc"/>
      <text x="22" y="38" font-size="18" font-weight="700" fill="#0f172a">科学边界</text>
      <text x="22" y="68" font-size="15" fill="#334155">可研究相关性、节律和环境影响</text>
      <text x="22" y="94" font-size="15" fill="#334155">不能直接推出神秘因果</text>
    </g>
  </g>
  <g stroke="#bfdbfe" stroke-width="3" fill="none" opacity="0.85">
    <path d="M316 156 C370 132 404 124 432 116"/>
    <path d="M644 156 C590 132 556 124 528 116"/>
    <path d="M316 374 C370 350 404 340 432 326"/>
    <path d="M644 374 C590 350 556 340 528 326"/>
  </g>
</svg>
