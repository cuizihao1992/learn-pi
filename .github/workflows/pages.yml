name: Deploy static site to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate course content
        run: |
          node scripts/validate-content-structure.mjs
          node scripts/check-links.mjs

      - name: Build and verify search index
        run: |
          node scripts/build-search-index.mjs
          git diff --exit-code -- search-index.json

      - name: Check JavaScript syntax
        run: |
          node --check theme.js
          node --check enhance.js
          node --check app.js
          node --check site-search.js
          node --check scripts/build-search-index.mjs
          node --check scripts/validate-content-structure.mjs
          node --check scripts/check-links.mjs

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
