<svg xmlns="http://www.w3.org/2000/svg" width="1150" height="640" viewBox="0 0 1150 640" role="img" aria-labelledby="title desc">
  <title id="title">世界观问题层级</title>
  <desc id="desc">从终极问题到世界观、政治治理和日常实践的四层结构。</desc>
  <rect width="1150" height="640" fill="#fbf7ee"/>
  <text x="575" y="52" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="31" font-weight="700" fill="#182125">把“人生意义”放进问题层级里看</text>
  <text x="575" y="88" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" fill="#607077">很多争论不是答案不同，而是回答的问题层级不同</text>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,7 L10,3.5 z" fill="#607077"/>
    </marker>
  </defs>
  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <rect x="175" y="130" width="800" height="86" rx="8" fill="#d7efea" stroke="#006c67" stroke-width="2"/>
    <text x="575" y="164" text-anchor="middle" font-size="22" font-weight="700" fill="#006c67">第一层：终极问题</text>
    <text x="575" y="193" text-anchor="middle" font-size="15" fill="#182125">为什么存在？为什么应该？真理和道德有没有最终根基？人生意义从哪里来？</text>

    <path d="M575 216 L575 252" stroke="#607077" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="175" y="260" width="800" height="86" rx="8" fill="#e8f1f8" stroke="#315d91" stroke-width="2"/>
    <text x="575" y="294" text-anchor="middle" font-size="22" font-weight="700" fill="#315d91">第二层：世界观回答</text>
    <text x="575" y="323" text-anchor="middle" font-size="15" fill="#182125">基督教、佛教、自然主义、康德、存在主义等尝试给出整体解释框架</text>

    <path d="M575 346 L575 382" stroke="#607077" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="175" y="390" width="800" height="86" rx="8" fill="#fff4df" stroke="#c98620" stroke-width="2"/>
    <text x="575" y="424" text-anchor="middle" font-size="22" font-weight="700" fill="#8b5c11">第三层：社会治理与政治思想</text>
    <text x="575" y="453" text-anchor="middle" font-size="15" fill="#182125">自由主义、保守主义、马克思主义、社会民主主义等讨论国家、制度、分配和秩序</text>

    <path d="M575 476 L575 512" stroke="#607077" stroke-width="3" marker-end="url(#arrow)"/>

    <rect x="175" y="520" width="800" height="72" rx="8" fill="#f8e7e6" stroke="#a93c38" stroke-width="2"/>
    <text x="575" y="550" text-anchor="middle" font-size="21" font-weight="700" fill="#a93c38">第四层：日常实践</text>
    <text x="575" y="578" text-anchor="middle" font-size="15" fill="#182125">读经、祷告、工作、爱人、修身、服务、学习和行动，是意义框架的落地，不等同于意义本身</text>
  </g>
</svg>
