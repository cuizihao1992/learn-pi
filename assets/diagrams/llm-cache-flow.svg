<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620" role="img" aria-labelledby="title desc">
  <title id="title">大模型上下文与缓存命中</title>
  <desc id="desc">稳定前缀可以触发 prompt cache，生成阶段使用 KV cache 复用历史 token 的 key value 中间结果。</desc>
  <rect width="1100" height="620" fill="#fbf7ee"/>
  <text x="550" y="48" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="30" font-weight="700" fill="#182125">大模型里的两类常见缓存</text>
  <text x="550" y="84" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, sans-serif" font-size="17" fill="#607077">Prompt Cache 复用稳定前缀；KV Cache 复用生成过程中的注意力中间值</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#607077"/>
    </marker>
  </defs>

  <g font-family="Microsoft YaHei, Segoe UI, sans-serif">
    <rect x="70" y="130" width="960" height="112" rx="8" fill="#ffffff" stroke="#d9d0c0" stroke-width="2"/>
    <text x="95" y="165" font-size="20" font-weight="700" fill="#182125">第 1 次请求</text>
    <rect x="95" y="184" width="205" height="34" rx="6" fill="#d7efea" stroke="#006c67"/>
    <text x="197" y="207" text-anchor="middle" font-size="15" fill="#006c67">system / developer</text>
    <rect x="315" y="184" width="215" height="34" rx="6" fill="#e8f1f8" stroke="#315d91"/>
    <text x="422" y="207" text-anchor="middle" font-size="15" fill="#315d91">工具定义 / 项目资料</text>
    <rect x="545" y="184" width="190" height="34" rx="6" fill="#fff4df" stroke="#c98620"/>
    <text x="640" y="207" text-anchor="middle" font-size="15" fill="#8b5c11">用户问题 A</text>
    <rect x="750" y="184" width="250" height="34" rx="6" fill="#f8e7e6" stroke="#a93c38"/>
    <text x="875" y="207" text-anchor="middle" font-size="15" fill="#a93c38">tool result / assistant</text>

    <rect x="70" y="295" width="960" height="112" rx="8" fill="#ffffff" stroke="#d9d0c0" stroke-width="2"/>
    <text x="95" y="330" font-size="20" font-weight="700" fill="#182125">第 2 次请求</text>
    <rect x="95" y="349" width="205" height="34" rx="6" fill="#d7efea" stroke="#006c67"/>
    <text x="197" y="372" text-anchor="middle" font-size="15" fill="#006c67">system / developer</text>
    <rect x="315" y="349" width="215" height="34" rx="6" fill="#e8f1f8" stroke="#315d91"/>
    <text x="422" y="372" text-anchor="middle" font-size="15" fill="#315d91">工具定义 / 项目资料</text>
    <rect x="545" y="349" width="190" height="34" rx="6" fill="#fff4df" stroke="#c98620"/>
    <text x="640" y="372" text-anchor="middle" font-size="15" fill="#8b5c11">用户问题 B</text>
    <rect x="750" y="349" width="250" height="34" rx="6" fill="#f8e7e6" stroke="#a93c38"/>
    <text x="875" y="372" text-anchor="middle" font-size="15" fill="#a93c38">新的工具结果</text>

    <path d="M197 218 L197 345" stroke="#006c67" stroke-width="4" marker-end="url(#arrow)"/>
    <path d="M422 218 L422 345" stroke="#315d91" stroke-width="4" marker-end="url(#arrow)"/>
    <text x="310" y="274" text-anchor="middle" font-size="18" font-weight="700" fill="#006c67">稳定前缀命中 Prompt Cache</text>

    <rect x="120" y="470" width="390" height="80" rx="8" fill="#d7efea" stroke="#006c67" stroke-width="2"/>
    <text x="315" y="501" text-anchor="middle" font-size="19" font-weight="700" fill="#006c67">Prompt Cache</text>
    <text x="315" y="528" text-anchor="middle" font-size="15" fill="#182125">复用相同前缀的预填充计算</text>

    <rect x="590" y="470" width="390" height="80" rx="8" fill="#e8f1f8" stroke="#315d91" stroke-width="2"/>
    <text x="785" y="501" text-anchor="middle" font-size="19" font-weight="700" fill="#315d91">KV Cache</text>
    <text x="785" y="528" text-anchor="middle" font-size="15" fill="#182125">生成时复用历史 token 的 K/V</text>
  </g>
</svg>
